[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-prep"
version = "0.1.0"
description = "Whiten, speed up and OCR scanned PDFs, doing only what each scan needs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "dragonleopardpig" }]
keywords = ["pdf", "scan", "ocr", "mrc", "internet-archive", "djvu"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Text Processing",
]
dependencies = [
  "pymupdf>=1.23",
  "numpy>=1.22",
  "pillow>=9",
  "pikepdf>=8",
]

# ocrmypdf and tesseract are invoked as external commands, not imported, so they
# are deliberately not Python dependencies: the whiten and fast passes work
# without them.

[project.urls]
Homepage = "https://github.com/dragonleopardpig/pdf-prep"

[project.scripts]
pdf-prep = "pdf_prep:main"

[tool.setuptools]
py-modules = ["pdf_prep"]
